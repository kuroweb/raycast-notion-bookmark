name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.actor == 'kuroweb' || github.actor == 'dependabot[bot]')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.actor == 'kuroweb' && startsWith(github.event.comment.body, '@claude review'))
    concurrency:
      group: claude-code-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # issue_comment はデフォルトブランチで起動するので PR の head を明示する。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
          fetch-depth: 1

      - name: Install review skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh skill install kuroweb/ai-manifest skills/gh-pr-review-ci --agent claude-code --scope user
          gh skill install kuroweb/ai-manifest skills/code-reviewing --agent claude-code --scope user

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]"
          track_progress: true
          prompt: |
            gh-pr-review-ci --pr ${{ github.event.pull_request.number || github.event.issue.number }}
          claude_args: |
            --model sonnet
            --allowedTools "Read,Grep,Glob,Skill(gh-pr-review-ci),Skill(code-reviewing),Bash(gh repo view:*),Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_inline_comment__create_inline_comment"
